<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00ac4e">
  <title>S-Bank Money Coach</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">S</span> Money Coach</div>
    <label class="who">
      <span class="sr">Demo customer</span>
      <select id="customer" aria-label="Demo customer"></select>
    </label>
  </header>

  <main id="feed">
    <section id="home" class="card" aria-live="polite">
      <div class="skeleton">Loading your money…</div>
    </section>
    <section id="chat" aria-live="polite"></section>
  </main>

  <footer class="dock">
    <div class="chips" id="chips"></div>
    <form id="ask" autocomplete="off">
      <input id="q" type="text" maxlength="500" placeholder="Ask your money anything…" aria-label="Your question">
      <button type="submit" aria-label="Send">➤</button>
    </form>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
