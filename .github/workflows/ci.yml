name: CI

on:
  push:
    branches: [main]
  pull_request:

# Stack checks (lint, type check, test, build) get added here once the stack is
# chosen. Until then CI runs only the repo hygiene checks, so the workflow is real
# and green from day one instead of a placeholder that never executes.

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo checks
        run: bash scripts/check.sh

  # --- template for the real checks ---------------------------------------------
